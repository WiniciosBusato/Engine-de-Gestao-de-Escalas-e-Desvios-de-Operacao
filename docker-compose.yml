version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wfm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin # Senha simples para o ambiente local
      POSTGRES_DB: wfm_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wfm_redis
    restart: always
    ports:
      - "5444:5432"

volumes:
  postgres_data: